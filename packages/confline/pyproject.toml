[project]
name = "confline"
version = "0.1.0"
description = "Declarative configuration and subcommand framework for CLI tools."
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "rich-argparse>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/confline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
