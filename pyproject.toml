[project]
name = "repository-crawlers-workspace"
version = "0.1.0"
description = "Tools for discovery and registration of public scientific datasets in Onedata"
requires-python = ">=3.12"
dependencies = [
    "repository-crawlers[all-plugins]",
    "repository-registrar",
]

[tool.uv]
package = false

[tool.uv.sources]
repository-crawlers = { workspace = true }
repository-registrar = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/crawlers",
    "apps/registrar",
]

[dependency-groups]
dev = [
    "black>=25.12",
    "isort>=7.0",
    "mypy>=1.19",
    "pylint>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "types-PyYAML",
    "types-requests",
]

# ─────────────────────────────────────────────────────────────────────────────
# Tool configuration
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"

# ─────────────────────────────────────────────────────────────────────────────
# Pylint — only non-default settings carried over from rc_file
# ─────────────────────────────────────────────────────────────────────────────

[tool.pylint.main]
py-version = "3.12"
fail-under = 10

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "use-symbolic-message-instead",
    "import-error",
    "missing-function-docstring",
    "missing-class-docstring",
    "fixme",
]

[tool.pylint.similarities]
min-similarity-lines = 40
