# Curated list of GWAS Catalog entries onboarded for the TopAnat workflow.
#
# Each entry is one of:
#   - { kind: trait,       id: <EFO_xxx | MONDO_xxx> }
#   - { kind: publication, id: "<pubmed_id>" }
#
# Trait entries pull metadata from /gwas/rest/api/efoTraits/{id} (GWAS v1,
# which still works for both EFO and MONDO short forms) and the human
# description from OLS by IRI lookup. Publication entries pull metadata
# from /gwas/rest/api/v2/publications/{pmid}.

