[project]
name = "repository-registrar"
version = "0.2.0"
description = "CLI for registering processed datasets in Onedata."
requires-python = ">=3.12"
dependencies = [
    "confline",
    "onedata-dataset",
    "requests>=2.31",
    "rich>=13.0",
    "urllib3>=2.0",
]

[project.scripts]
registrar = "registrar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/registrar"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
