# eCUDO Crawler Configuration
#
# This file contains all available configuration options.
# Copy to ecudo.yaml and customize as needed.
#
# Configuration hierarchy (higher priority overrides lower):
#   1. CLI arguments (highest priority)
#   2. Config file (ecudo.yaml)
#   3. Environment variables (ECUDO_* prefix)
#   4. Default values (lowest priority)

# Crawler settings
crawler:
  # Base URL for eCUDO API
  base_url: "http://central.ecudo.pl"
  
  # Number of records per page (pagination)
  page_size: 200
  
  # Number of concurrent workers for fetching metadata
  concurrency: 128
  
  # Request timeout in seconds
  timeout: 15
  
  # Maximum retry attempts per request
  max_retries: 3

# Processor settings
processors:
  # Diversity filter - limits similar datasets to ensure variety
  diversity_filter:
    # Enable/disable the filter
    enabled: true
    
    # Maximum number of datasets with similar titles to accept
    max_similar: 10
    
    # Similarity threshold (0.0-1.0) - titles above this are considered similar
    # 0.85 means 85% similar or more = same group
    similarity_threshold: 0.85
  
  # URL validator - checks if download URLs are accessible
  url_validator:
    # Enable/disable URL validation
    # Disabling speeds up crawling but may include broken links
    enabled: true

# Output settings
output:
  # Directory for output files
  dir: "./data"
  
  # Output format: jsonl (streaming) or json (array)
  format: "jsonl"

# Environment variables reference:
# 
# ECUDO_BASE_URL - Crawler base URL
# ECUDO_PAGE_SIZE - Records per page
# ECUDO_CONCURRENCY - Number of workers
# ECUDO_TIMEOUT - Request timeout
# ECUDO_MAX_RETRIES - Max retry attempts
# ECUDO_DIVERSITY_FILTER_ENABLED - Enable diversity filter (true/false)
# ECUDO_DIVERSITY_MAX_SIMILAR - Max similar datasets
# ECUDO_DIVERSITY_SIMILARITY_THRESHOLD - Similarity threshold
# ECUDO_URL_VALIDATOR_ENABLED - Enable URL validation (true/false)
# ECUDO_OUTPUT_DIR - Output directory
# ECUDO_OUTPUT_FORMAT - Output format (jsonl/json)
